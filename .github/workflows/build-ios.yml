name: build-ios
on:
  workflow_dispatch:
  push:
    branches: [main, local-ai-organizer]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned
        run: xcodebuild -project ClipPiP.xcodeproj -scheme ClipPiP -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ClipPiP.app Payload/
          zip -r ClipPiP.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ClipPiP-ipa
          path: ClipPiP.ipa
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Keyboard layout test (simulator)
        run: xcodebuild test -project ClipPiP.xcodeproj -scheme ClipPiPKeyboardTests -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO
