name: ClipPiP
options:
  bundleIdPrefix: com.clippip
  deploymentTarget:
    iOS: "15.0"
targets:
  ClipPiP:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - target: ClipPiPKeyboard
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: ClipPiP
        CFBundleShortVersionString: "1.6"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: com.clippip.app
            CFBundleURLSchemes: [clippip]
        NSLocalNetworkUsageDescription: Sends copied clips to your PC on the local network.
        NSBonjourServices: ["_http._tcp"]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clippip.app
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  ClipPiPKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: ClipPiP
        CFBundleShortVersionString: "1.6"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clippip.app.keyboard
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  ClipPiPKeyboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: Sources/ClipOrigin.swift
      - path: Sources/PromptSelection.swift
      - path: Keyboard
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clippip.keyboardtests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
